services:
  alpha:
    build:
      context: ./Project_Alpha
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_PATHBASE: /alpha
      DOTNET_CONTENTROOT: /app
    networks:
      - dokploy-network
    restart: unless-stopped

  omega:
    build:
      context: ./Project_Omega
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_PATHBASE: /omega
      DOTNET_CONTENTROOT: /app
    volumes:
      - omega_data:/app/App_Data
    networks:
      - dokploy-network
    restart: unless-stopped

volumes:
  omega_data:

networks:
  dokploy-network:
    external: true
