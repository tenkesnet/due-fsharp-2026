services:
  alpha:
    build:
      context: ./Project_Alpha
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_PATHBASE: /alpha
    networks:
      - internal
    restart: unless-stopped

  omega:
    build:
      context: ./Project_Omega
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_PATHBASE: /omega
    volumes:
      - omega_data:/app/App_Data
    networks:
      - internal
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - alpha
      - omega
    networks:
      - internal
    restart: unless-stopped

volumes:
  omega_data:

networks:
  internal:
    driver: bridge
